<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            width: 640px;
            height: 480px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="emulator"></div>
    </div>

    <script>
        // Configurações do EmulatorJS
        EJS_player = '#emulator';
        EJS_core = 'gba'; // Define o sistema como Game Boy Advance
        
        // Caminho dos arquivos do sistema hospedados na CDN oficial do EmulatorJS
        EJS_pathtodata = 'https://emulatorjs.org'; 
        
        // Caminho relativo para a sua ROM (mude para o nome exato do seu arquivo)
        EJS_gameUrl = 'pokemon.gba'; 
    </script>

    <!-- Carrega o script principal do emulador -->
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
