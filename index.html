<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda Online</title>
    <!-- Importação de fonte Pixel Art -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* Fundo degradê temático verde/floresta estilo Zelda */
            background: linear-gradient(135deg, #0a2f1d 25%, #1b4d3e 50%, #0a2f1d 75%);
            background-size: 400% 400%;
            animation: forestBg 12s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            color: #ffd700; /* Dourado Triforce */
            text-shadow: 3px 3px 0px #d4a373, 6px 6px 0px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
        }
        /* Moldura para o container do jogo */
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 6px solid #ffd700; /* Borda dourada */
            box-shadow: 0 0 0 6px #000000, 0 20px 40px rgba(0,0,0,0.8);
            image-rendering: pixelated;
        }
        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 4px solid #1b4d3e;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        /* Animação suave do fundo */
        @keyframes forestBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Responsividade básica para telas menores */
        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <h1>ZELDA ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Script de inicialização limpo e compatível com servidores CDN -->
    <script type="text/javascript">
        window.EJS_player = '#game';
        window.EJS_core = 'gba'; 
        window.EJS_gameName = 'Zelda: Minish Cap'; 
        window.EJS_color = '#1b4d3e'; 
        window.EJS_startOnLoaded = false;
        
        // Caminho absoluto forçado via unpkg para evitar falhas de deploy local
        window.EJS_pathtodata = 'https://unpkg.com';
        
        // Definição do arquivo do jogo (Certifique-se de que ele se chama 'zelda.gba' no repositório)
        window.EJS_gameUrl = 'zelda.gba'; 
        
        window.EJS_cacheUrl = true;
        window.EJS_defaultSettings = {
            'save-state-location': 'browser'
        };
    </script>
    
    <!-- Script carregador puxado diretamente da infraestrutura estável do unpkg -->
    <script src="https://unpkg.comloader.js"></script>

</body>
</html>
