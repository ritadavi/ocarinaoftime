<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Station - GBA</title>
    <style>
        /* Modern Reset and Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Neon Ambient Glow effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ff007f;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
            top: 10%;
        }

        /* Main Console Frame */
        .console-wrapper {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, #252830, #17191d);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 
                        inset 0 2px 3px rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        /* Top Bar with Brand/Status */
        .console-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .brand-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
        .power-led {
            width: 8px;
            height: 8px;
            background-color: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 8px #39ff14;
        }

        /* Video Screen Container */
        .screen-area {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            width: 640px;
            height: 480px;
            max-width: 90vw;
            max-height: 70vh;
        }
        #emulator {
            width: 100%;
            height: 100%;
        }

        /* Quick Info Footer */
        .console-footer {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: #8a8d93;
            letter-spacing: 1px;
        }

        /* Subtle Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Styled Console Body -->
    <div class="console-wrapper">
        <div class="console-header">
            <div class="brand-title">ADVANCE STATION</div>
            <div class="power-led" title="System Active"></div>
        </div>
        
        <div class="screen-area">
            <div id="emulator"></div>
        </div>

        <div class="console-footer">
            PRESS START TO PLAY • POWERED BY EMULATORJS
        </div>
    </div>

    <!-- EmulatorJS Implementation Configuration -->
    <script>
        // Place your game file name here
        const NOME_DO_ARQUIVO_JOGO = "seu-jogo.gba"; 

        EJS_player = "#emulator";
        EJS_core = "gba"; 
        EJS_gameUrl = NOME_DO_ARQUIVO_JOGO; 
        EJS_pathtodata = "https://jsdelivr.net";
        
        // Custom UI configurations for EmulatorJS
        EJS_startOnLoaded = false; // Shows a neat splash image before running
        EJS_Color = "#00f0ff";     // Matches the theme with neon blue elements inside the player
    </script>

    <!-- Main Loader Core -->
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
