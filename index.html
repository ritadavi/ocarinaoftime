<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda Minish Cap GBA Online</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a2f1d 25%, #1b4d3e 50%, #0a2f1d 75%);
            background-size: 400% 400%;
            animation: psychedelic 12s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            color: #ffeb3b;
            text-shadow: 3px 3px 0px #006400, 6px 6px 0px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 6px solid #ffffff;
            border-image: linear-gradient(to bottom, #ffffff, #a0a0a0) 1;
            box-shadow: 0 0 0 6px #000000, 0 20px 40px rgba(0,0,0,0.8);
        }

        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 4px solid #3a3a3a;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        @keyframes psychedelic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>THE MINISH CAP ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Configurações do EmulatorJS para Game Boy Advance -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Zelda The Minish Cap';
        EJS_color = '#006400';
        EJS_startOnLoaded = false;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // encodeURIComponent garante que espaços e vírgulas no nome do arquivo sejam lidos corretamente pela Vercel/GitHub
        EJS_gameUrl = encodeURIComponent('Legend of Zelda, The - The Minish Cap (USA).gba');

        EJS_cacheUrl = true;
        EJS_defaultSettings = {
            'save-state-location': 'browser'
        };
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
