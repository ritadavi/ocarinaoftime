<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Minish Cap - GBA Online</title>
    <!-- Importação da fonte Pixel Art -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fundo psicodélico animado estilo retrô */
            background: linear-gradient(135deg, #0b1d12 25%, #1b4d3e 50%, #0b1d12 75%);
            background-size: 400% 400%;
            animation: psychedelic 12s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            color: #ffeb3b;
            text-shadow: 3px 3px 0px #2e7d32, 6px 6px 0px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
            line-height: 1.5;
        }

        /* Moldura estilo caixa de texto clássica de RPG retrô */
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 6px solid #ffffff;
            box-shadow: 0 0 0 6px #000000, 0 20px 40px rgba(0,0,0,0.8);
            image-rendering: pixelated;
        }

        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 4px solid #3a3a3a;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        /* Efeito de animação do fundo (ajustado para tons de verde Zelda) */
        @keyframes psychedelic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Responsividade para telas menores */
        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>THE MINISH CAP</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <script type="text/javascript">
        // Nome exato do arquivo que você enviou
        const NOME_DO_SEU_ARQUIVO = "Legend of Zelda, The - The Minish Cap (USA).gba"; 

        EJS_player = '#game';
        EJS_core = 'gba'; 
        EJS_gameName = 'The Legend of Zelda: The Minish Cap';
        EJS_color = '#2e7d32'; // Verde temático do Link
        EJS_startOnLoaded = false;
        
        // Servidor CDN atualizado e estável
        EJS_pathtodata = 'https://jsdelivr.net';
        EJS_gameUrl = NOME_DO_SEU_ARQUIVO; 
        
        // Mantém os saves guardados no navegador do jogador
        EJS_defaultSettings = {
            'save-state-location': 'browser'
        };
    </script>
    <script src="https://jsdelivr.netloader.js"></script>
</body>
</html>
